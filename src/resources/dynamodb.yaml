AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFormation template for additional AWS resources: DynamoDB tables

Parameters:
  Env:
    Description: Deploying environment
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
#  VpcId:
#    Type: String
#    Description: The ID of the VPC
#  RouteTableIds:
#    Type: List<String>
#    Description: The list of Route Table IDs

Conditions:
  IsProductionEnv: !Equals [!Ref Env, "prod"]

Resources:
  # TODO: Use VPCEndpoint & VPC for better security
  # --------------------------------------------------------------------- VPC Endpoint for DynamoDB
  # DynamoDBEndpoint:
  #   Type: "AWS::EC2::VPCEndpoint"
  #   Properties:
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
  #     VpcId: !Ref VpcId
  #    VpcEndpointType: "Gateway"
  #    RouteTableIds: !Ref RouteTableIds

  # ------------------------------------------------------------------------------- DynamoDB tables
  ImageProcessingCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "serverless-image-processing-cache-tbl-${Env}"
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: processing_date
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: processing_date
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      BillingMode: !If [IsProductionEnv, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProductionEnv
        - !Ref "AWS::NoValue"
        - ReadCapacityUnits: 1
          WriteCapacityUnits: 1
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
